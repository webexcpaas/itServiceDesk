<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeneriCorp Inc. - Account Password Reset</title>
  <style>
    :root {
      --primary: #0066cc;
      --primary-hover: #004d99;
      --bg: #f4f7f9;
      --card-bg: #ffffff;
      --text: #1c2833;
      --text-muted: #5c6b73;
      --border: #d0d7de;
      --error: #d9381e;
      --error-bg: #fdf2f0;
      --success: #28a745;
      --success-bg: #f0fff4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid var(--primary);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
    }

    .brand svg {
      width: 32px;
      height: 32px;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .brand-subtitle {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 460px;
      padding: 2.5rem 2rem;
    }

    .card-title {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: var(--text);
      text-align: center;
    }

    .card-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.15);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }

    .alert {
      padding: 1rem;
      border-radius: 6px;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    .alert-error {
      background-color: var(--error-bg);
      color: var(--error);
      border: 1px solid rgba(217, 56, 30, 0.2);
    }

    .alert-success {
      background-color: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(40, 167, 69, 0.2);
    }

    .param-info {
      background: #edf2f7;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #4a5568;
      margin-bottom: 1.5rem;
      word-break: break-all;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="8" fill="#0066CC"/>
        <path d="M12 20C12 15.5817 15.5817 12 20 12C23.3137 12 26.155 14.0177 27.3223 16.8995" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M28 20C28 24.4183 24.4183 28 20 28C16.6863 28 13.845 25.9823 12.6777 23.1005" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="20" cy="20" r="3" fill="white"/>
      </svg>
      <div>
        <div class="brand-title">GeneriCorp Inc.</div>
        <div class="brand-subtitle">IT Identity Portal</div>
      </div>
    </div>
  </header>

  <main>
    <div class="card">
      <h1 class="card-title">Reset Password</h1>
      <p class="card-subtitle">Enter your existing credentials and choose a new password.</p>

      <div id="alertBox" class="alert"></div>

      <form id="passwordForm">
        <div class="form-group">
          <label for="oldPassword">Current Password</label>
          <input type="password" id="oldPassword" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required autocomplete="new-password" placeholder="••••••••">
        </div>

        <button type="submit" id="submitBtn" class="btn">Update Password</button>
      </form>
    </div>
  </main>

  <footer>
    &copy; 2026 GeneriCorp Inc. All rights reserved. | Security &amp; Identity Management
  </footer>

  <script>
    // GitHub Actions deployment test variables
    const apiKey = "{{apiKey}}";
    const serviceKey = "{{serviceKey}}";

    console.log("Using API Key:", apiKey);

    // Helper function to strip non-digit characters (+, spaces, dashes)
    const cleanPhone = (str) => String(str || '').replace(/\D/g, '');

    // Extract URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const urlSysId = urlParams.get('sys_id') || '';
    const urlPhone = urlParams.get('phone') || '';

    const alertBox = document.getElementById('alertBox');
    const passwordForm = document.getElementById('passwordForm');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, isSuccess = false) {
      alertBox.textContent = message;
      alertBox.className = `alert ${isSuccess ? 'alert-success' : 'alert-error'}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    passwordForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert();

      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;

      // Input Validation
      if (!oldPassword || !newPassword) {
        showAlert("Please fill in both password fields.");
        return;
      }

      if (oldPassword === newPassword) {
        showAlert("New password cannot match your current password.");
        return;
      }

      if (!urlSysId) {
        showAlert("Error: Missing required sys_id parameter in URL.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";

      try {
        // API Call 1: ServiceNow PUT request
        const serviceNowUrl = `https://jpwxccdemo.service-now.com/api/now/table/sys_user/${urlSysId}`;
        
        const putResponse = await fetch(serviceNowUrl, {
          method: 'PUT',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json',
            'Authorization': `${apiKey}`
          },
          body: JSON.stringify({
            "user_password": newPassword,
            "password_needs_reset": "false"
          })
        });

        if (!putResponse.ok) {
          throw new Error(`ServiceNow API Error: ${putResponse.status} ${putResponse.statusText}`);
        }

        const data = await putResponse.json();
        const userResult = data.result || {};

        const retrievedName = userResult.name || '';
        const retrievedUserName = userResult.user_name || '';
        const retrievedEmail = userResult.email || '';
        const retrievedPhone = userResult.phone || '';
        const retrievedMobile = userResult.mobile_phone || '';

        // Clean all phone numbers for flexible digit-only comparison
        const normalizedUrlPhone = cleanPhone(urlPhone);
        const normalizedRetrievedPhone = cleanPhone(retrievedPhone);
        const normalizedRetrievedMobile = cleanPhone(retrievedMobile);

        // DEBUG LOGS - Open F12 DevTools Console to inspect
        console.log("URL Phone (raw):", `"${urlPhone}"`, "➜ Normalized:", `"${normalizedUrlPhone}"`);
        console.log("ServiceNow Phone:", `"${retrievedPhone}"`, "➜ Normalized:", `"${normalizedRetrievedPhone}"`);
        console.log("ServiceNow Mobile:", `"${retrievedMobile}"`, "➜ Normalized:", `"${normalizedRetrievedMobile}"`);

        // Check if normalized URL phone matches either ServiceNow phone or mobile_phone
        const isPhoneMatch = normalizedUrlPhone && (
          normalizedUrlPhone === normalizedRetrievedPhone || 
          normalizedUrlPhone === normalizedRetrievedMobile
        );

        // Verification check
        if (!retrievedName || !isPhoneMatch) {
          console.warn("Verification Failed. RetName:", retrievedName, "PhoneMatch:", isPhoneMatch);
          showAlert("Error: The provided details did not match the employee database.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Update Password";
          return;
        }

        // API Call 2: Webex Connect POST Event
        const webexHookUrl = "https://hooks.uk.webexconnect.io/events/B08D8DYKXC";
        
        const postResponse = await fetch(webexHookUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'key': `${serviceKey}`
          },
          body: JSON.stringify({
            "phone": retrievedPhone,
            "name": retrievedName,
            "email": retrievedEmail,
            "user_name": retrievedUserName
          })
        });

        if (!postResponse.ok) {
          throw new Error(`Webex Hook Error: ${postResponse.status} ${postResponse.statusText}`);
        }

        showAlert("Password successfully updated and account synchronized!", true);
        passwordForm.reset();

      } catch (err) {
        console.error("Workflow Error:", err);
        showAlert(`An error occurred: ${err.message}`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
      }
    });
  </script>
</body>
</html>
