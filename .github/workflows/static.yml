name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"] # Set to your primary branch name if different

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Replaces {{apiKey}} and {{serviceKey}} across all HTML files
      - name: Substitute Secrets in HTML Files
        env:
          APIKEY: ${{ secrets.APIKEY }}
          SERVICEKEY: ${{ secrets.SERVICEKEY }}
        run: |
          sed -i "s|{{apiKey}}|$APIKEY|g" *.html
          sed -i "s|{{serviceKey}}|$SERVICEKEY|g" *.html

      - name: Setup Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads root directory containing index.html, nope404.html, and reset-password.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
